name: Launcher release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    if: github.event.repository.visibility == 'public'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - name: Verify public source boundary
        shell: powershell
        run: .\tools\check-repository-boundary.ps1
      - name: Test release tooling
        run: python -m unittest discover -s tools/tests -p "test_*.py"
      - name: Verify release tag and main ancestry
        if: startsWith(github.ref, 'refs/tags/')
        run: python tools/verify-release-tag.py --tag "${{ github.ref_name }}"
      - name: Package launcher
        shell: powershell
        run: .\tools\package-launcher.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: PinyonShift-Launcher
          path: .artifacts/PinyonShift-Launcher.zip
      - name: Attach tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $release = Get-Content config/release.json -Raw | ConvertFrom-Json
          $arguments = @(
            'release', 'create', $env:RELEASE_TAG,
            '.artifacts/PinyonShift-Launcher.zip',
            '--generate-notes', '--verify-tag'
          )
          if ($release.channel -eq 'preview') {
            $arguments += '--prerelease'
          } elseif ($release.channel -ne 'stable') {
            throw "Unsupported release channel: $($release.channel)"
          }
          & gh @arguments
