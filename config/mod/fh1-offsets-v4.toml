# Field offsets for the FH1 v4 title-update build (docs/TITLE_UPDATE_V4_BACKLOG.md
# TU-4). Each value was verified on aligned base/v4 instructions whose base
# register provably holds the object; the comment names one such site
# (base -> v4). tools/generate-fh1-symbols.py --v4 requires an entry for every
# offset in fh1-symbols.toml.

