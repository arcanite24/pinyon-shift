# Diagnostic, default off (pinyon_shift_car_challenge_gate_probe): the v4
# pause action for 1000 CLUB (case 19 of sub_827EBEE0) checks LIVE sign-in
# with sub_824CB900 (failure: sub_827EAC98, "not signed in") and the Forza
# server with sub_824D2090 (failure: sub_82753478(menu, 4, 20), "server not
# available") before opening the Car Challenge screen (sub_82EAA148). These
# hooks follow each check at this call site only.
[[midasm_hook]]
address = 0x827EC3A8
name = "PinyonShiftCarChallengeLiveGate"
registers = ["r3"]

[[midasm_hook]]
address = 0x827EC3C0
name = "PinyonShiftCarChallengeServerGate"
registers = ["r3"]

[[midasm_hook]]
# Entry of sub_824127B8(service): "is the Forza Horizon server available"
# ((+9012 == 2 or +13276) and +13205 of [0x833CABB0]). Default-off 1000 Club
# diagnostic (pinyon_shift_car_challenge_gate_probe) answers yes for every
# direct caller; otherwise the original body runs.
address = 0x824127B8
name = "PinyonShiftServerAvailableProbe"
registers = ["r3", "lr"]
return_on_true = true

[[midasm_hook]]
# Entry of CScoreboardManager::SubmitCarChallenge (r4 car, r5 challenge). With
# the default-off 1000 Club probe, commit the completion locally instead of
# waiting for the defunct ChallengeCompleted web service.
address = 0x829490D8
name = "PinyonShiftCarChallengeSubmitLocal"
registers = ["r4", "r5"]
context = true
return_on_true = true
