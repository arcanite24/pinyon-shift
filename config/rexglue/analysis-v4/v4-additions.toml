# Hand-maintained analysis facts for code that exists only in the FH1 v4
# title update (no base-disc counterpart to port). Included by the generated
# main-xex.toml; record the evidence for every entry.

# New v4 function sub_827611D8: a byte jump table at 0x82051030, scaled by 4
# from 0x82761230. The bound is `cmplwi cr6, r4, 9` (index copied to r30), but
# an unrelated `lfd` sits between it and the `bgt`, so the analyzer read past
# the ten entries into the next table and merged sub_827613E8's code, emitting
# REX_FATAL stubs for its branches (82761420/82761460 -> 827616FC, etc.).
[[switch_tables]]
address = 0x8276122C
register = 30
labels = [
  0x82761230, 0x827612BC, 0x82761230, 0x827612BC, 0x82761230,
  0x827612BC, 0x82761230, 0x827612BC, 0x82761230, 0x827612BC,
]

# Function-pointer targets outside .pdata that the v4 analysis did not emit
# (tools/find-fh1-missing-thunks.py). The first v4 run stopped on an indirect
# call to 82E55C00 (M3_TRACE indirect.unregistered, lr 82F07AF8). Each is a
# straight-line sequence referenced by a lis/addi pair in .pdata code:
# 8276BBA8 and 832074B0 are tail branches, 82788148 stores a zero byte and
# returns, 82864D70 is an r12 virtual-call thunk, 82E55C00 swaps r3/r4 and
# tail-branches.
[functions."8276BBA8"]
size = 0x04

[functions."82788148"]
