# Pause-item insertion experiment (UI-04 insertion half). The title's
# create-by-name entry sub_82E78078 has exactly one call site: 0x82E7A38C in
# the per-child builder sub_82E7A238, after the builder has resolved the
# element record's contract name into the stack object at r1+96. A hook on the
# following instruction observes the created component (r3), its parent
# container (r31), the 28-byte CUI4CustomObject descriptor (r30) and the
# authored element record (r28). Menu-item batches do not reach the entry hook
# at 0x82E7A238 (their calls enter the builder through an interior dispatch
# address), so this call site is the only place that sees every item
# construction. `context = true` hands the live guest context and memory base
# to the host function so it can invoke recompiled guest code. Default-off:
# every host path returns immediately unless
# PINYON_SHIFT_UI_EXPERIMENT=insert_item.
[[midasm_hook]]
address = 0x82E7A394
name = "PinyonShiftUiPauseItemInsert"
registers = ["r3", "r28", "r30", "r31"]
after_instruction = true
context = true

