# Manual main-XEX analysis facts for the verified MS-2505 default.xex.
# Evidence and the rationale for every entry are recorded in the milestone
# boundary reports under docs/research/.

includes = ["fh1-post-processing.toml"]

# NR-00 graphics-hook owner. This is the sole title call to VdSwap, observed
# immediately before the import without changing registers or control flow.
# Future graphics hooks must dispatch through src/native_renderer/ rather than
# acquiring a second owner in the general runtime-hooks translation unit.
[[midasm_hook]]
address = 0x829EFEB8
name = "PinyonShiftObserveGraphicsFrame"

# NR-00/NR-05A title dispatch discovery. Static PM4 construction evidence maps
# the draw and visibility-query packet wrappers; 0x824079B8 is the promoted
# title adapter that directly calls the indexed wrapper. Each hook runs after
# the wrapper's opening mflr r12, so r12 contains the unmodified caller LR
# while r3-r10 still contain entry metadata. The bounded, default-off census
# neither reads guest resource payloads nor changes registers, packets, or
# control flow.
[[midasm_hook]]
address = 0x824079BC
name = "PinyonShiftObserveDrawAdapterDispatch"
registers = ["r3", "r4", "r5", "r6", "r7", "r8", "r9", "r10", "r12"]

[[midasm_hook]]
