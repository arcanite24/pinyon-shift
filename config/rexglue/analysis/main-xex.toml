# Manual main-XEX analysis facts for the verified MS-2505 default.xex.
# Evidence and the rationale for every entry are recorded in the milestone
# boundary reports under docs/research/.

includes = ["fh1-post-processing.toml"]

# Microsoft CRT non-local jump pair. Keep these root keys before any table:
# longjmp restores the host-side PPCContext captured at the setjmp call site.
setjmp_address = 0x82A81E80
longjmp_address = 0x82A81950

# Keep the condition-register fields a function uses in C++ locals instead of
# ctx (#467). Calls follow the PowerPC ABI (only cr2-cr4 are written back);
# hooks, the setjmp copy, longjmp and exceptions keep a full sync.
cr_as_local = true

# CTR and XER are volatile across calls and dead at every return address, so a
# function keeps them in zero-initialized locals that never touch ctx
# (NEXT_LEVEL_RESEARCH.md NL-1.3). FH1 has no overflow-enabled integer
# instruction and its one mtxer restores a saved context, so XER.SO is never
# set: with the local, the SO copy in every compare folds to zero.
ctr_as_local = true
xer_as_local = true

# The title's fibers run on host fibers ([rexcrt] below), so the host call
# chain is never abandoned at a guest stack switch and no function needs an
# entry at a return address: no resume switch, no resume aliases
# (NEXT_LEVEL_RESEARCH.md NL-1.2).
interior_resume = false

# Direct calls name the strong `__imp__sub_` definitions so Clang can inline
# guest functions; the functions src/guest_native replaces with a strong
# `sub_` of its own keep going through the weak thunk (NL-1.5). The list holds
# every PINYON_GUEST_NATIVE replacement, including those reached only through
# function pointers today; tools/port-fh1-v4-analysis.py checks it.
direct_calls_bypass_thunk = true
host_overridden_functions = [0x82438EA8, 0x8245DBE0, 0x82A6D7D8, 0x82F86498,
    0x82FC7A00, 0x830A86F8, 0x830A96A8, 0x830AF230, 0x830B0570, 0x830B06C8,
    0x830B08B0, 0x830B0A38, 0x830B5260, 0x830B6500, 0x830B6510, 0x830F2210]

# Loads from a constant .rdata address (lis/addi then lfs, lfd, lwz, ...) become
# literals; the runtime refuses an image whose folded bytes differ (NL-1.10).
fold_rodata_loads = true

# A function whose prologue calls __savegprlr_N keeps rN-r31 in host locals
# instead of the guest stack slots (NEAR_NATIVE_RESEARCH.md NN-1.2): ctx is
# write-through, so the copy back at each __restgprlr_N gives the caller the
# same registers. The LR slot and back chain are still written. Functions the
# generator's save-area scan cannot clear (slot loads, dynamic frames, tail
# branches, exception info, mid-asm hooks such as the UI trace hooks that read
# r1+160/168) keep the helpers; host_local_register_saves_keep lists more.
host_local_register_saves = true

# The LR save slot (entry r1 - 8) moves into a host local as well
# (NEAR_NATIVE_RESEARCH.md NN-1.3): the prologue's slot store, from the inlined
# __savegprlr_N or an explicit stw, and its reloads become copies through
# `rex_saved_lr`, so r12 and ctx.lr keep their values and only the guest stack
# word is gone. The generator's LR-slot scan keeps the slot in memory for any
# other slot access, a dynamic frame, exception info, a mid-asm hook, or a tail
# branch to code that may read it first. The back chain is still written, so
# stall_dump still walks the stack, but its "returns to" column and the M5
# reentry trace read stale words for changed frames. The keep list holds the
# functions whose slot a host reader needs: sub_82BC5870 (TraceVehiclePose
# reads its caller_lr at r1+392; the mid-asm hook keeps it anyway).
host_local_lr = true
host_local_lr_keep = [0x82BC5870]

# Physics specialised at build time (NEAR_NATIVE_RESEARCH.md NN-5.1). The
# generator, not the repository, produces the native form from the player's
# executable (docs/LEGAL.md). register_locals_functions keeps every guest
# register of the listed functions in C++ locals, writing ctx back at calls
# and returns and reading the volatile registers back after calls; such a
# function with flush-mode toggles runs only in fixed FP mode (the default
# on arm64) and tail calls an unspecialised ieee_ copy otherwise.
# fixed_fp_mode_functions reads the fixed FP mode switch once per call instead
# of at every toggle; single_precision_functions computes fmadds-family
# operations on single-precision operands as one single fma (the guest's
# rounding) instead of a double fma rounded to single. The list is the 19 of
# the 131-function physics family whose arm64 code got at least 3 % shorter
# with no more memory accesses (NDK clang, release flags); the tyre model
# sub_82D2F348 and the others got longer and stay as they were.
register_locals_functions = [0x82CB6308, 0x82CB7A88, 0x82CB9F98, 0x82CBA9F8,
    0x82D0FA28, 0x82D123D0, 0x82D1D4E8, 0x82D20A40, 0x82D210F8, 0x82D21DB0,
    0x82D230B8, 0x82D2EC70, 0x82D2F070, 0x82D303D0, 0x82D37C70, 0x82D39140,
    0x82D3A350, 0x82D48518, 0x82E2D5A8]
fixed_fp_mode_functions = [0x82CB6308, 0x82CB7A88, 0x82CB9F98, 0x82CBA9F8,
    0x82D0FA28, 0x82D123D0, 0x82D1D4E8, 0x82D20A40, 0x82D210F8, 0x82D21DB0,
    0x82D230B8, 0x82D2EC70, 0x82D2F070, 0x82D303D0, 0x82D37C70, 0x82D39140,
    0x82D3A350, 0x82D48518, 0x82E2D5A8]
single_precision_functions = [0x82CB6308, 0x82CB7A88, 0x82CB9F98, 0x82CBA9F8,
    0x82D0FA28, 0x82D123D0, 0x82D1D4E8, 0x82D20A40, 0x82D210F8, 0x82D21DB0,
    0x82D230B8, 0x82D2EC70, 0x82D2F070, 0x82D303D0, 0x82D37C70, 0x82D39140,
    0x82D3A350, 0x82D48518, 0x82E2D5A8]
# Reference copies of the specialised call-free functions for the lockstep
# verifier (pinyon_shift_reference_verify, src/guest_native/reference_verify.cpp).
reference_functions = [0x82CB6308, 0x82CB7A88, 0x82CB9F98, 0x82CBA9F8,
    0x82D0FA28, 0x82D123D0, 0x82D1D4E8, 0x82D20A40, 0x82D21DB0, 0x82D230B8,
    0x82D2F070, 0x82D303D0, 0x82D37C70, 0x82D39140, 0x82D3A350, 0x82D48518,
    0x82E2D5A8]
# Region oracle (#749): the root and every function it reaches are emitted
# twice more as logged copies, compared with the PowerPC interpreter on
oracle_regions = [0x82D210F8]
# Native region pilot (#750): the root's region also as inline copies on
# one local context, run with pinyon_shift_native_region.
native_regions = [0x82D210F8]

# Lockstep verify (NL-0.2): every 40th leaf function is also emitted as a
# reference copy with every register in ctx and no folding; with
# pinyon_shift_reference_verify=N the host runs both every Nth call and
# compares (src/guest_native/reference_verify.cpp).
reference_sample_every = 40

