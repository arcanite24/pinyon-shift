name = "PinyonShiftTraceUiStringTableLoad"
registers = ["r1"]

[[midasm_hook]]
address = 0x82CAC740
name = "PinyonShiftTraceUiStringTableChunk"
registers = ["r3", "r26", "r29", "r30", "r31"]
after_instruction = true

# 0x82CAC704 calls the allocator for the chunk (r3 = size, r26 = verbatim
