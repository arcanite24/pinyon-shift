[[midasm_hook]]
address = 0x82C666D0
name = "PinyonShiftTraceSavePreEncryption"
registers = ["r4", "r5"]

# sub_828E2898 is about to read the non-durable per-profile career eligibility
# byte through sub_8252AA48. Repair the actual byte for a valid durable
# checkpoint so later progression gates observe the restored eligibility too.
[[midasm_hook]]
address = 0x828E292C
name = "PinyonShiftRestoreCareerEligibility"
registers = ["r3", "r4", "r31"]

# Retain the post-read guard for older saves and emit the established restore
# marker whether the pre-read repair or this final return override admitted the
# valid first-time-career activity.
[[midasm_hook]]
address = 0x828E2930
name = "PinyonShiftRestoreCareerCheckpointGate"
registers = ["r3", "r31"]

# sub_828D7EB0 has just advanced the live onboarding state from the Viper to
# the Corrado drive. Persist that same stage in the activity before the next
# ordinary profile save so a complete process exit can resume here.
[[midasm_hook]]
address = 0x828D7ED4
name = "PinyonShiftPersistPostViperCheckpoint"
registers = ["r31"]
after_instruction = true

