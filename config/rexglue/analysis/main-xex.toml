# Record the physical identity of the exact PM4_DRAW_INDX_2 header without
# reading or changing the packet. The original stwu executes after the hook.
[[midasm_hook]]
address = 0x82410328
name = "PinyonShiftObserveDrawPacketSubmission"
registers = ["r3"]

