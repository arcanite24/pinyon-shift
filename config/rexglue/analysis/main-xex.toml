# pointer stores that only happen when PINYON_SHIFT_UI_EXPERIMENT=insert_item.
[[midasm_hook]]
address = 0x82F268D0
name = "PinyonShiftTraceUiItemBuildCall"
registers = ["r24", "r25", "r26", "r29", "r31"]

