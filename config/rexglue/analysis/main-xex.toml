# call at 0x82F268EC is the one that enters sub_82E7A238. At this point r24 is the
# document the deserializer got from the element (records, arena and pool live
# there), r25 is the element the builder is called on, r26 the created item
# record and r31 the section context whose +92 vector is the record pool the
# stream's parent index resolves through. The insertion experiment reads those
# pointers here so it can replay the title's own item construction; tracing reads
