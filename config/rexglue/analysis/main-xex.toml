# The geometry lookup consumes at least three byte indices before it consults
# the entry count and later reloads the entry pointer. Preserve readable
# triplets; otherwise redirect the entry to a process-lifetime zero-index
# buffer large enough for the full uint8 count.
[[midasm_hook]]
address = 0x82D3CD58
name = "PinyonShiftValidateGeometryOutput"
registers = ["r4", "r5", "r6"]

[[midasm_hook]]
address = 0x82D3CD80
name = "PinyonShiftValidateGeometryLookup"
registers = ["r4", "r5", "r6", "r11"]

# Geometry blobs contain a count and a relocated byte-index-list pointer. A
# continuation may expose an entry whose count is nonzero while the complete
# list range is unreadable. Normalize that invalid pair to an empty list in the
# relocated entry before the loop condition, so sibling consumers cannot
# repeatedly observe the same corrupt count; the host hook records the repair.
[[midasm_hook]]
address = 0x82D3DB54
name = "PinyonShiftValidateGeometryIndexList"
registers = ["r8", "r29", "r31"]

# The same serialized 12-byte entry carries a sibling byte-index list at +0
# and its count at +8. Validate this pair independently after the count load so
# a primary-list repair cannot fall through to an equivalent unreadable lbzx.
# Invalid pairs are normalized in the relocated entry for subsequent consumers.
[[midasm_hook]]
address = 0x82D3DBF4
name = "PinyonShiftValidateGeometrySecondaryIndexList"
registers = ["r6", "r29", "r31"]

# M4 repeated geometry-list AV diagnostic. This hook observes the list pointer
# immediately before the faulting lbzx in 0x82D3DB00. It does not suppress or
# redirect the read; the normal crash evidence path remains authoritative.
[[midasm_hook]]
address = 0x82D3DB6C
name = "PinyonShiftTraceGeometryIndex"
registers = ["r9", "r11", "r29", "r30", "r31"]

# Opt-in M4 route telemetry seed. The hook is rate-limited to 5 Hz and performs
# read-only observation only when PINYON_SHIFT_M4_TELEMETRY=1. The frame-loop
# fields observed here are consumed by the instruction stream immediately after
# this address; vehicle pointer/transform offsets remain discovery outputs.
[[midasm_hook]]
address = 0x823EDA10
name = "PinyonShiftTraceFrameTelemetry"
registers = ["r28", "r31"]

# FH1's render job queue (sub_823F4B30) keeps a producer at most twice its
# threshold ahead of the job thread by yielding, then gives up after 1000
# yields and posts anyway. On the 360 that wait outlasts a render thread
# stall; on the host NtYieldExecution returns at once, so a slow GPU frame
# let the main thread queue hundreds of jobs, the job thread then filled
# more than the render thread's 12 slots in one pass, and the render thread
# read a slot early (AV in sub_82416A00) or waited on a lost signal (hang).
# The hook, before the yield, waits in host time instead: still bounded.
[[midasm_hook]]
address = 0x823F4F60
name = "PinyonShiftThrottleRenderJobs"
registers = ["r1"]

# The swap interrupt (sub_829EED78) compares how late the swap is (r7, percent
# of a display period) with its threshold (r27) to choose between the
# current and the next vblank; r8 is the previous swap's target vblank, r10
# the current vblank count.
[[midasm_hook]]
address = 0x829EEE44
name = "PinyonShiftReleaseLateSwap"
registers = ["r7", "r8", "r10"]

# Constant per-update steps written for the console's 30 updates a second,
# scaled by real time between updates (pinyon_shift_fixed_steps_real_time).
# CUI4AnimatedCamera::Update (sub_82649960) has chosen its per-call step (1/30
# s, or 1/60 under a UI flag) in f1, about to advance the scripted shot by it.
[[midasm_hook]]
address = 0x826499C8
name = "PinyonShiftScaleAnimatedCameraStep"
registers = ["r31", "f1"]

# The trackside crowd's animation update (proceduralGeometry, sub_82E08A00):
# r29 is the models object once the prologue has run; at 0x82E09144 and
# 0x82E0945C r10 holds the per-frame step the title loaded from +0x3EAE4 of
# the render context, about to be added to an instance's animation frame.
[[midasm_hook]]
address = 0x82E08A30
name = "PinyonShiftCrowdStepBegin"
registers = ["r29"]

[[midasm_hook]]
address = 0x82E09144
name = "PinyonShiftCrowdStepRandom"
registers = ["r10"]

[[midasm_hook]]
address = 0x82E0945C
name = "PinyonShiftCrowdStepLooping"
registers = ["r10"]

# FH1 has finalized the variable gameplay delta in f31 immediately before
# storing it at +448 on the main-loop owner and dispatching update systems.
# Accumulate that title-authored delta for wall-time validation without
# changing the register, store, or update cadence.
[[midasm_hook]]
address = 0x823EDB84
name = "PinyonShiftObserveSimulationDelta"
registers = ["f31"]

# Player-vehicle presentation stabilization and authoritative M4 pose telemetry.
# Runtime write-watch evidence maps
# this address to the instruction immediately after the active transform slot's
# position and forward vectors have been stored by sub_82BC5870. The hook always
# can suppress isolated implausible presentation transforms when explicitly
# enabled; structured telemetry remains opt-in and rate-limited in the host.
[[midasm_hook]]
address = 0x82BC5A3C
name = "PinyonShiftTraceVehiclePose"
registers = ["r1", "r30", "r31"]

# sub_826E1B10 assigns an intrusive pointer: AddRef the source object, store
# it, release the old one. M4 (PID 25180) and #371 reached the AddRef with a
# source slot that still pointed at freed storage (vtable 0x....487C), and
# faulted reading vtable+8. When the vtable's AddRef is not recompiled game
# code, assign null instead of a dangling pointer.
[[midasm_hook]]
address = 0x826E1B3C
name = "PinyonShiftTraceRetainVtable"
registers = ["r4", "r11", "r30", "r31"]
jump_address_on_true = 0x826E1B48

# Default-off read-only #359/#368/#373 ownership comparison. Pair the live
# child slot/vtable around the parent virtual call, before the wrapper clears
# parent+64 and dispatches the child. No guest register or memory is changed.
[[midasm_hook]]
address = 0x82C222EC
name = "PinyonShiftTraceChildDispatchBefore"
registers = ["r3", "r11"]

[[midasm_hook]]
address = 0x82C222F0
name = "PinyonShiftTraceChildDispatchAfter"
registers = ["r3", "r30"]

# #327/#359/#366/#368/#373/#376: the wrapper takes the pending child from
# parent+64 and calls its slot-3 release. In every report that child's
# storage had already been freed: its "vtable" is heap data (xxxx487C) or its
# release slot is null, so the call faults. Skip only a release whose target
# does not resolve to recompiled game code; a valid child is untouched.
[[midasm_hook]]
address = 0x82C22308
name = "PinyonShiftGuardChildDispatch"
registers = ["r11"]
jump_address_on_true = 0x82C2231C

# #367: sub_82F9F130 reloads its output handle into r31 and, on this path,
# reads [r31+68] and then [that+208]. The report reached it with a null
# handle. Both of the function's other exits return 0 without further work,
# so take that exit when the handle (or its +68 owner) is not readable.
[[midasm_hook]]
address = 0x82F9F338
name = "PinyonShiftGuardNullOutputHandle"
registers = ["r31"]
jump_address_on_true = 0x82F9F36C

# M5 persisted-profile diagnostics. These continuations are the first
# title-owned decision points after the secure ForzaProfile/PlayerDatabase
# reads complete. The hooks are read-only and emit events only when
# PINYON_SHIFT_M5_SAVE_TRACE=1.
[[midasm_hook]]
address = 0x825195F4
name = "PinyonShiftTracePersistedProfileOwner"
registers = ["r3", "r26", "r28", "r30", "r31"]

[[midasm_hook]]
address = 0x82568490
name = "PinyonShiftTracePersistedProfileResult"
registers = ["r3", "r31"]

[[midasm_hook]]
address = 0x824ED444
name = "PinyonShiftTraceFrontEndProfileResult"
registers = ["r3", "r31"]

[[midasm_hook]]
address = 0x827A1DC4
name = "PinyonShiftTraceFrontEndStateResult"
registers = ["r3", "r29", "r31"]

# Capture the title's plaintext profile/database body immediately before the
# secure stream wrapper encrypts and writes it. The runtime hook is gated by
# PINYON_SHIFT_M5_SAVE_TRACE=1 (the encrypted and stream writers keep only the
# two established save-body sizes), so normal preview runs remain unchanged.
[[midasm_hook]]
address = 0x82C79D2C
name = "PinyonShiftTraceSavePayload"
registers = ["r4", "r5", "r12"]
after_instruction = true

# The secure stream transform receives the original serialized body here;
# capture it before the wrapper forwards encrypted bytes to 0x82C79D28.
[[midasm_hook]]
address = 0x82C78240
name = "PinyonShiftTraceSaveStreamPayload"
registers = ["r4", "r5", "r12"]
after_instruction = true

# sub_82C665F8 has accumulated the serialized body at r4/r5 here and has not
# yet entered the in-place XeKeysAesCbcUsingKey call at 0x82C666D0.
[[midasm_hook]]
address = 0x82C666D0
name = "PinyonShiftTraceSavePreEncryption"
registers = ["r4", "r5"]

# sub_82C66308 has decrypted a secure file in place with
# XeKeysAesCbcUsingKey (r8 = 0) and cleared its padding: the plaintext is
# [r30+0] for r24 bytes, and the title has not parsed it yet. The save
# editor (NP-8.3) and the save.after_decrypt mod hook run here.
[[midasm_hook]]
address = 0x82C66594
name = "PinyonShiftObserveSaveDecrypted"
registers = ["r24", "r30"]

# sub_82C05530 reads game-file blocks and checks each with sub_82BFFDA0
# against a per-file SHA-256 table ([r24+28], 32 bytes a block; the path is
# [r24+32]); a mismatch ends in the dirty-disc error. These run on the
# check's result for whole blocks and for the last partial block, and
# accept it only for files an enabled mod replaces (NP-10.2).
[[midasm_hook]]
address = 0x82C057D0
name = "PinyonShiftAcceptModdedBlock"
registers = ["r3", "r24"]

[[midasm_hook]]
address = 0x82C0580C
name = "PinyonShiftAcceptModdedLastBlock"
registers = ["r3", "r24"]

# sub_82C03E90 opens such a file and compares its real size (r6, from
# sub_82A7CDB8) with the size in the title's table (r31); a mismatch ends in
# the same error. For a file a loaded mod replaces the real size is accepted
# (NP-10.1: a rebuilt archive is larger than the original). The path is at
# [r1+92]; r31 becomes the stream's size.
[[midasm_hook]]
address = 0x82C041A4
name = "PinyonShiftAcceptModdedFileSize"
registers = ["r1", "r6", "r31"]

# NP-4.4 Hor+: sub_823E22C8 returns a viewport's width / height (f1; the
# viewport is r3, width and height at +8 and +12) to the camera, its culling
# frustum and projection. For the 1280x720 main view a wider window's aspect
# is returned instead, so the title renders (and culls) a wider horizontal
# field of view into the same 16:9 buffer, which the presenter stretches.
[[midasm_hook]]
address = 0x823E22F4
name = "PinyonShiftViewportAspect"
registers = ["r3", "f1"]

# sub_8284EF90 returns a camera's vertical field of view in radians (f1, from
# [r3+304]) to the frustum and projection code; the field-of-view setting
# scales it.
[[midasm_hook]]
address = 0x8284EF94
name = "PinyonShiftCameraFieldOfView"
registers = ["f1"]

# sub_828E2898 is about to read the non-durable per-profile career eligibility
# byte through sub_8252AA48. Repair the actual byte for a valid durable
# checkpoint so later progression gates observe the restored eligibility too.
[[midasm_hook]]
address = 0x828E292C
name = "PinyonShiftRestoreCareerEligibility"
registers = ["r3", "r4", "r31"]

# Retain the post-read guard for older saves and emit the established restore
# marker whether the pre-read repair or this final return override admitted the
# valid first-time-career activity.
[[midasm_hook]]
address = 0x828E2930
name = "PinyonShiftRestoreCareerCheckpointGate"
registers = ["r3", "r31"]

# sub_828D7EB0 has just advanced the live onboarding state from the Viper to
# the Corrado drive. Persist that same stage in the activity before the next
# ordinary profile save so a complete process exit can resume here.
[[midasm_hook]]
address = 0x828D7ED4
name = "PinyonShiftPersistPostViperCheckpoint"
registers = ["r31"]
after_instruction = true

# M4 source-slot classification. PID 31612's malformed-vtable event came from
# this specific sub_82C6DEF0 call site with source slot 0x43D29E00. Observe
# only that call immediately before the shared retain helper; do not alter its
# arguments or the title's normal failure behavior.
[[midasm_hook]]
address = 0x82C6DFA8
name = "PinyonShiftTraceRetainSourceSlot"
registers = ["r3", "r4", "r26", "r27", "r29", "r31"]

