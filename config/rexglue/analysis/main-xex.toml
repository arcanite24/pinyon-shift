# The title's CRT memory routines, served by the SDK's host natives
# (kernel/crt/memory.cpp). memmove's forward path branches into memcpy's
# entry, which is a whole-function call in the generated code.
[rexcrt]
memcpy = 0x82A7D730
memmove = 0x82A7DCA0
memset = 0x82A7F140
# XAPI's fiber functions, served by the SDK's host fibers
# (kernel/crt/threading.cpp). Found from the only callers of
# KeSetCurrentStackPointers: SwitchToFiber tail-calls the context switch;
# CreateFiber allocates a 2,640-byte context (the SDK's X_FIBER_CONTEXT size)
# and a kernel stack with the entry thunk 0x830EBEA0; ConvertThreadToFiber
# fails with ERROR_ALREADY_FIBER (1280) when KTHREAD+0x164 is set;
# DeleteFiber frees the kernel stack. GetCurrentFiber (0x830EBC60) stays
# guest code: it reads the KTHREAD field the SDK maintains.
ConvertThreadToFiber = 0x830EBC70
ConvertFiberToThread = 0x830EBD00
CreateFiber = 0x830EBD50
DeleteFiber = 0x830EBE30
SwitchToFiber = 0x830EBE90

