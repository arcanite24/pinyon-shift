# Pinyon Shift manifest for the FH1 v4 title update (TITLE_UPDATE_V4_BACKLOG).
# The USA 0.0.0.10 executables are patched while loading: .local/game/v4-codegen
# holds copies of them beside the player's own v4 .xexp files, and the
# generator runs with --xex_apply_patches=true. Output stays separate from the
# base build's generated tree.

[project]
name = "pinyon_shift"
sdk_version = "0.10.0"
game_root = "../../.local/game/v4-codegen"

[entrypoint]
file_path = "../../.local/game/v4-codegen/default.xex"
out_directory_path = "../../.local/generated-v4/default"
includes = ["analysis-v4/main-xex.toml"]

[[modules]]
guest_path = "SpeechFacade_default.xex"
file_path = "../../.local/game/v4-codegen/SpeechFacade_default.xex"
out_directory_path = "../../.local/generated-v4/speech"
includes = ["analysis-v4/speech-facade.toml"]

[[modules]]
guest_path = "XMediaFacade_default.xex"
file_path = "../../.local/game/v4-codegen/XMediaFacade_default.xex"
out_directory_path = "../../.local/generated-v4/xmedia"
includes = ["analysis-v4/xmedia-facade.toml"]
