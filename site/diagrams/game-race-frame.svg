<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 210" role="img" aria-label="Order of work in a race frame on the Xbox 360 GPU, with draw counts from a race-start capture"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs><rect x="10" y="50" width="120" height="90" rx="6" class="box"/><text x="70.0" y="83.5" text-anchor="middle" class="t-head">Depth D24S8</text><text x="70.0" y="99.5" text-anchor="middle" class="t-small">1,079 draws</text><text x="70.0" y="114.5" text-anchor="middle" class="t-small">shadow atlases</text><rect x="142" y="50" width="120" height="90" rx="6" class="box"/><text x="202.0" y="83.5" text-anchor="middle" class="t-head">Float depth</text><text x="202.0" y="99.5" text-anchor="middle" class="t-small">1,094 draws</text><text x="202.0" y="114.5" text-anchor="middle" class="t-small">camera view</text><path d="M130 95 L140 95" class="edge" marker-end="url(#arrow)"/><rect x="274" y="50" width="120" height="90" rx="6" class="box"/><text x="334.0" y="83.5" text-anchor="middle" class="t-head">2x MSAA</text><text x="334.0" y="99.5" text-anchor="middle" class="t-small">197 draws</text><text x="334.0" y="114.5" text-anchor="middle" class="t-small">colour, depth</text><path d="M262 95 L272 95" class="edge" marker-end="url(#arrow)"/><rect x="406" y="50" width="120" height="90" rx="6" class="host"/><text x="466.0" y="83.5" text-anchor="middle" class="t-head">Main scene 4x</text><text x="466.0" y="99.5" text-anchor="middle" class="t-small">2,579 draws</text><text x="466.0" y="114.5" text-anchor="middle" class="t-small">predicated tiles</text><path d="M394 95 L404 95" class="edge" marker-end="url(#arrow)"/><rect x="538" y="50" width="120" height="90" rx="6" class="gpu"/><text x="598.0" y="83.5" text-anchor="middle" class="t-head">Post chain</text><text x="598.0" y="99.5" text-anchor="middle" class="t-small">~43 renderings,</text><text x="598.0" y="114.5" text-anchor="middle" class="t-small">~21 resolves</text><path d="M526 95 L536 95" class="edge" marker-end="url(#arrow)"/><rect x="670" y="50" width="120" height="90" rx="6" class="guest"/><text x="730.0" y="91.0" text-anchor="middle" class="t-head">UI and swap</text><text x="730.0" y="107.0" text-anchor="middle" class="t-small">HUD, VdSwap</text><path d="M658 95 L668 95" class="edge" marker-end="url(#arrow)"/><text x="400" y="175" text-anchor="middle" class="t-small">about 20 clears and 95 resolves a frame; 2,900 to 7,400 draws by scene</text></svg>
