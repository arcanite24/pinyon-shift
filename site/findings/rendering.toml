base = """82416A00, 0x82416EFC, 82409398, 8240CF68, 8240D070, 829F5FF0, 829F6360, 8246FB98, 0x8246FC1C"""
v4 = """824469B0, 0x82446EAC, 82439348, 8243CF18, 8243D020, 82AB2F60, 82AB32D0, 8249F310, 0x8249F394"""
name = """D3D command buffers"""
what = """FH1 renders from prebuilt D3D command buffers (display lists). `82416A00` is `D3DDevice_RunCommandBuffer`, the per-object list executor; `82409398` writes the ring and moves its write pointer; `8240CF68` and `8240D070` close and submit segments. A list is an `IDirect3DCommandBuffer` (resource type 9): +116 chains (size, physical address) pairs, one indirect buffer each; +24..+56 mark inherited and +64..+96 overwritten state, +108 holds flags and +112 dependent resources. Nothing patches a list when it runs: per-frame state goes into the calling segment just before the indirect-buffer packet. `829F5FF0` and `829F6360` are D3D runtime code that replays the tiling stream into the ring once per tile on D3D's worker threads. The executor stores each list's `INDIRECT_BUFFER` header at `0x82416EFC`, inside its loop over the +116 chain. The whole function is 407 instructions with 27 calls, up to four of them segment closes that can wait on a fence, so that store, not a native body, is the place to hook list execution. A second producer of `INDIRECT_BUFFER` packets, `8246FB98`, stores its header at `0x8246FC1C` (59,382 calls in a desktop race, 4.6 a presented frame, from 14 callers). The executor itself ran 542 times a presented frame."""
how = """Reverse engineering of the generated code, matched against the decoder's indirect-buffer census; call counts from the probe build (NL-2.3, 12,992 presents)."""
confidence = """probable"""
note = """Corrects an earlier guess that `8240xxxx`-`8246xxxx` were engine constructors. The lists are not immutable: NN-0.10's write watch found most of them rewritten after they had run (see "display-list writers"). "Nothing patches a list when it runs" holds for the executor itself; the engine patches a list's fixup slots just before calling it (see "D3D command-buffer fixups"). `829EC928` (v4 `82AA9898`) runs resource type 10 (async command-buffer calls) and is reached only from the executor (guess)."""
