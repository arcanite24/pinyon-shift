[[finding]]
group = """Frame structure and views"""
name = """scene world-view-projection constants"""
what = """Scene vertex shaders read the object's world-view-projection matrix from vertex float constants `c128`-`c131`, one row each for clip x, y, z and w (clip = matrix times position). The static world shares one matrix: the largest group of equal matrices in a free-roam frame is 600-660 draws. Because the world matrix of static geometry does not change, the previous frame's matrix times the inverse of the current one is the camera's own reprojection; over six static groups it agreed within 6e-4 while driving. Each predicated tile replays the same draws with the same matrices. The lens follows from the matrix: the y row's length is 1 / tan(fov_y / 2), 48.5 degrees for the low chase camera (the `CameraSettings.ini` value), and the z and w rows give the near plane 0.3 and the far plane about 19,960-20,000."""
how = """Probe build logging the constants of every depth-tested draw, group census across frames, and the UP-1.4 motion vectors built from it, which keep the static world sharp under FSR 3."""
confidence = """confirmed"""
source = """docs/UPSCALING_BACKLOG.md UP-1.3, UP-1.4; ShiftGlue src/graphics/vulkan/fh1_camera.cpp"""

