[[finding]]
group = """D3D inside the game"""
base = """sub_823E67A8, sub_829EE1F8, 0x829F5948, sub_829F6620, 0x82586398"""
name = """D3D GPU-to-CPU callbacks"""
what = """The 12 `WAIT_REG_MEM`s a frame are D3D's callback handshake (InsertCallback, `sub_823E67A8`): wait until 3D idle, set `SCRATCH_REG4` to the callback, `REG5` to the context and `REG0` to the CPU mask, wait for the write-backs, `INTERRUPT`, wait for the handler (`sub_829EE1F8`) to clear the mask, then set `REG4` to `0x0BADF00D`. Two callbacks run: `0x829F5948`, D3D's predicated-tiling step, which queues the next tile's replay for the worker `sub_829F6620` (a 4-entry queue per hardware thread), and `0x82586398`, the engine's GPU frame-end timestamp. Neither releases memory that earlier draws read."""
how = """Static analysis; completing the handshakes at decode time cut the waits from 12 to 3 a frame with correct rendering."""
confidence = """confirmed"""
source = """docs/DESKTOP_RENDERER_BACKLOG.md DR-1.2"""

