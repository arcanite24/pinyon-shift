[[finding]]
group = """Frame structure and views"""
name = """scaled texture binding ownership"""
what = """A texture's fetch constants do not identify its current memory owner. Above 1x, a resolve selects the scaled buffer while a CPU write can return the same allocation to ordinary shared memory. Retaining an outdated texture pointer in the binding memo bypassed that selection even when the fetch constants were unchanged. Outdated entries now select their host texture again; unrelated textures retain their contents."""
how = """Shared cache source analysis and a backend-independent unit regression exercising CPU-to-resolve-to-CPU transitions, an inactive binding, and an unrelated texture. The fixture uses synthetic allocations, not guest function addresses."""
confidence = """confirmed"""
issue = """#628"""
note = """This establishes a related renderer defect at scaled resolutions. The complete sequence is qualified separately at 1x and 2x with the compressed ownership correction; this memo correction alone did not remove the bad signs."""
source = """docs/native-renderer/LIVERY_TEXTURE_OWNERSHIP.md; SDK tests/unit/graphics/texture_cache_test.cpp"""

