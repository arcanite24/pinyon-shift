group = """Mixer and output"""
base = """sub_82FAE0B8, sub_82FAB740, sub_82FAC780, sub_82FAC840, sub_82FB76C0"""
v4 = """sub_8306F2E8, sub_8306C970, sub_8306D9B0, sub_8306DA70, sub_83078858"""
name = """FMOD matrix mix"""
what = """`sub_82FAE0B8` mixes a voice's channels into its output through a level matrix: 1,437,684 calls in a race, 66.7 a mix block. It dispatches on the input channel count. On the Odin 46 % of its time is the six-in, six-out loop (36 multiply-adds a sample, against 4 for stereo) and 45 % the conversion of the half-precision level matrix to floats, which it redoes on every call. `sub_82FAB740` is its level ramp (108,798 calls). Together they are 2.0 % of the Odin process.

Its contract, which an NN-4.3 native twin implemented exactly (since removed): the connection mix `sub_82FB76C0` calls it once per input connection, after zeroing the output for the first. Arguments: r3 the connection, r4 the output (added to), r5 the input, r6 the output and r7 the input channel counts (both interleaved floats), r8 the frames; it returns 0, and a null input does nothing. The connection holds the level rows at +36 (s16, one per output channel) and columns at +38 (s16, one per input channel), three arrays of eight row pointers to 16-bit float levels (targets at +40, current levels with the volume applied at +72, per-frame ramp steps at +104), the frames of ramp left at +144 (u16) and the volume at +148. While a ramp is left, `sub_82FAB740` (same arguments, with the frames cut to the ramp) mixes those frames with the current levels, adding the steps after every frame, writes the levels and steps back, takes the frames off +144 and, when that reaches zero, sets every current level to its target times the volume. The rest of the block adds nothing when the volume is below 2e-5 (about -94 dB) and otherwise adds, per output channel o, the sum over input channels i of level[o][i] times in[i], with the current levels. With six or eight channels in and out, two target shapes take a channel-for-channel path: an identity target at a volume of exactly 1 (tested by `sub_82FAC780`) uses the current diagonal, and a target whose rows have only their first entry set (`sub_82FAC840`) gives output channel c input channel c times its first-column level, not input 0. Stereo to stereo skips off-diagonal levels below 2e-5. The levels are Xenon float16 as ShiftGlue emulates `vpkd3d128`/`vupkd3d128`: packing truncates and saturates to 0x7FFF, with no infinities, and subnormals unpack to zero."""
how = """Loop structure, arguments and field accesses in the generated code of the mix, the ramp, the two target tests and the caller; call counts from the probe build (NL-2.3); Odin call-graph samples (cg2, 30 fps) placed on its loops by their multiply counts. The v4 functions are exact matches except the two target tests (context matches with identical code bytes)."""
confidence = """confirmed"""
note = """The contract is read from the generated code and confirmed by experiment: with the twin's per-call verify (pinyon_shift_fmod_dsp_verify) on every call of an Odin race, 1,286,144 calls matched the original within 60 dB with no state difference (build S). The ramp steps, writes back and mixes only the levels the call uses (output channels by input channels), so a mono input with six-column rows leaves columns 1 to 5 alone until the ramp ends. The game thread's level setters write the current and step rows and the ramp count without a lock while the mixer runs: those bytes changed during calls with no ramp, where neither run writes them, and all the earlier mismatches went away once the verify repeated both runs to tell such writes apart (313 calls raced in build S). The twin gave no gain: the in-run A/B on the Odin race moved the FMOD mixer thread by -0.031 ± 0.071 ms a frame at about 125 calls a frame, so it was removed (site/pages/lessons.md). What the first-column target means in FMOD is not known."""
source = """docs/NEAR_NATIVE_RESEARCH.md NN-4.3; site/pages/lessons.md"""

