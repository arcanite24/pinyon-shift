[[finding]]
group = """Archives"""
base = """ZIP method 21, extra field 0x1123"""
v4 = """same"""
name = """ZIP container quirks"""
what = """FH1 archives are ZIP files whose central directory carries, for each member, extra field `0x1123` (4 bytes): the absolute offset of the member's payload. The title reads that offset, so a rewritten archive must update it along with the local-header offsets; ordinary ZIP repacking leaves it pointing into unrelated data. Some archives omit local headers, and their directory offset is then the payload itself. The CRC is of the decompressed data."""
how = """Archive reader and writer (`fh1_archive.cpp`, `patch-fh1-archive.py`); repacked archives with and without offset updates; an unchanged rebuild reproduced 120 of 120 stock archives byte for byte, and a rebuilt `EN.zip` with a replaced `PauseMenu.str` loaded in game."""
confidence = """confirmed"""
source = """tools/patch-fh1-archive.py; src/ui/hostui/fh1_archive.cpp; docs/NATIVE_PORT_BACKLOG.md NP-10.1; docs/DLC_BACKLOG.md Base-disc Rally investigation"""

[[finding]]
group = """Archives"""
base = """ZIP method 21 (XMem)"""
v4 = """same"""
name = """XMem LZX frame format"""
what = """A method-21 payload is a run of frames, each 32 KiB of output. A full frame starts with a big-endian u16 compressed size; a shorter frame starts with `0xFF` and big-endian u16 uncompressed and compressed sizes. The frame bodies concatenate into one LZX stream, decoded with a 64 KiB window (falling back to 128 or 32 KiB). A stream of LZX uncompressed (type 3) blocks with the E8 transform off also decodes."""
how = """Host extractor decoding every member it reads and checking the CRC, checked against all UI archives and byte for byte against QuickBMS; a writer of type-3 streams validated by the extractor."""
confidence = """confirmed"""
note = """Whether the title itself accepts type-3 streams is not tested."""
source = """tools/fh1_archive_extract.cpp; tools/patch-fh1-archive.py; src/ui/hostui/fh1_archive.h"""

