name = """compression methods in use"""
what = """99.3 % of archive members (257,122) use method 21, the Xbox XMem LZX codec; 1,415 are stored (method 0) and 399 deflated (method 8). Every member carries extra field `0x1123`, which the game reads for the absolute payload offset."""
