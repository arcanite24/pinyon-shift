# --- Textures and models ----------------------------------------------------

[[finding]]
group = """Textures and models"""
base = """.xds"""
v4 = """same"""
name = """XDS texture header"""
what = """An `.xds` texture is a `0x34`-byte (52-byte) header, first u32 = 3, holding a Xenos texture fetch constant at `0x1C` (format, width and height, pitch, tiling, endianness, swizzle, mip count, packed mips), followed by the texture data. A base level no larger than 16 texels sits in the packed mip tail."""
how = """`inspect-fh1-ui.py` decodes every UI texture; uncompressed textures re-encode to the stored bytes."""
confidence = """confirmed"""
source = """tools/inspect-fh1-ui.py parse_xds, decode_xds; docs/UI_ASSETS.md"""

[[finding]]
