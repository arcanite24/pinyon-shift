# --- String tables ----------------------------------------------------------

[[finding]]
group = """String tables"""
base = """.str (LSB2)"""
v4 = """same"""
name = """LSB2 string table format"""
what = """A `.str` table is big-endian, with an `LSB2` header whose u32 at +12 is the offset of the string chunk and whose u32 at +16 counts the chunk pointers from +20 (four in a 36-byte header). The chunks are contiguous and unaligned: the strings ([u32 size][u32 count], then count + 1 entries of (u16 key, u32 character offset) in ascending key order, the last a `0xFFFF` sentinel pointing at a trailing empty string, then a pool of NUL-terminated UTF-16BE strings), the `IDS_` names (key, 1-based position in the key-order chunk, byte offset, an ASCII pool in source order), optional translator notes, and the key order. A key is a 16-bit hash of the lower-case name: start at 0xFFFF and, for each character, XOR it in and rotate left by 7; it matches all 10,415 names in the 113 English tables. A new key must go into chunks 0, 1 and 3 (7 tables have no chunk 3); `tools/fh1-strings.py` adds keys and rebuilds tables byte-identical to the originals. `set_ui_string` replaces only existing keys, because the game's own count of a loaded table is kept apart from the chunk, where was not found. Tables live LZX-compressed in `media/StringTables/<language>.zip`."""
how = """Parser and writer in `tools/fh1-strings.py`; the hash fitted to every name; replaced tables load in game (mod string overrides, custom station names)."""
confidence = """confirmed"""
source = """docs/REVERSE_ENGINEERING.md@fc1751fe2a38 Custom content; tools/fh1-strings.py; src/pinyon_shift_runtime_hooks.cpp NP-1.5 comment"""

[[finding]]
group = """String tables"""
base = """sub_82CAFF28, sub_82CAC5B8, sub_82CB1FB0, 0x82CAFFA0, 0x82CAC704, 0x82CAC740, 0x82CB00AC, 0x82CB2018"""
v4 = """0x82D71A88, 0x82D6E25C, 0x82D6E298, 0x82D71B94, 0x82D73B00"""
name = """string table loader and lookup"""
what = '''`sub_82CAFF28` builds the path `game:\media\StringTables\<table><language>.str` (at `0x82CAFFA0` the stack string at r1+96 holds it with `.str` appended) and `sub_82CAC5B8` parses the chunk into a fresh allocation (`0x82CAC704` is the allocation, r3 the size). At `0x82CAC740` (r30 payload, r29 length, r26 flag) the payload is copied verbatim when the ownership flag is set; otherwise it is expanded into a fixed-stride table. `0x82CB00AC` stores the parsed handle the localization manager keeps, and `sub_82CB1FB0` looks a key up: at `0x82CB2018` r3 holds the resolved string and r29 the key. The title reads a string up to its NUL and reads a table when it next loads it. Tables load in name order. In `pausemenu.str`, key `0xDD6B` is `IDS_Multiplayer`, the MULTIPLAYER pause row label (`IDS_MultiplayerOption` reads the same), and `0xDED7` is PHOTO MODE.'''
how = """Hooks on load, parse and lookup, used to rewrite and extend strings (the pause row reads SETTINGS); rewriting `0xDD6B` changed only the pause row; `tools/fh1-strings.py` listing."""
confidence = """confirmed"""
source = """config/rexglue/analysis/main-xex.toml string table hooks; src/pinyon_shift_runtime_hooks.cpp PinyonShiftTraceUiStringTableChunk, PinyonShiftSizeUiStringChunk; src/pinyon_shift_runtime_hooks.cpp PinyonShiftTraceUiStringLookup; docs/NATIVE_PORT_BACKLOG.md NP-1.5; docs/MODDING.md HUD labels and menu actions"""

