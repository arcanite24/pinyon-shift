base = """media/UI archives, Fonts.zip, Horizon.zip"""
v4 = """same"""
name = """UI textures and fonts"""
what = """The four UI archives hold 4,373 `.xds` textures (2,825 uncompressed), in 8888 and DXT1/3/5 formats (also as 16_16_16_16 variants) and DXT3A/DXT5A, tiled with a packed mip tail, plus vector fonts and `fontmap.xml`. The Latin fonts are GPU meshes, not bitmaps: no installed TTF matches their advances within 5 %, and their coverage rule is in the title's shader. UI layout is a 1280x720 space with a 90 % safe area; `Fonts.zip` and `Horizon.zip` hold the fonts, selection mask and button art."""
