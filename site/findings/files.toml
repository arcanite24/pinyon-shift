# --- Other formats ----------------------------------------------------------

[[finding]]
group = """Other formats"""
base = """media/shaders/**/*.fxobj, default.xex"""
name = """shader corpus"""
what = """Shader programs ship in `media/shaders/**/*.fxobj`, some inside method-21 `bin.zip` archives (197 archived members). The retail disc has 4,293 containers with 3,349 unique raw programs (1,615 vertex, 1,734 pixel); its 34 vertex declarations patch the fetch templates into 8,377 more vertex programs. `default.xex` holds further programs and vertex declarations used by the map and motion passes; with them there are 3,819 raw programs in 4,770 containers, and 12,846 programs counting derived vertex variants (10,818 vertex, 2,028 pixel). In 6 minutes of Mac free roam, 264 of the 266 pixel shaders drawn were disc programs, but 89 of 224 vertex shaders were not: each differed from a same-size disc program in 1-36 dwords, fetches patched for vertex layouts the shader files do not hold. Both shaders of every on-disc pipeline pair (138) came from the same source file."""
how = """Extraction over loose assets, LZX archives and the loaded executable image; leaving out the executable's programs gave a blank map and smeared cars. The play census joined stored pipelines and microcode (`.vk.signs.xpso`, `.xsh`) to the corpus by SHA-256."""
confidence = """confirmed"""
source = """docs/native-renderer/CANDIDATE_SHADER_CAPTURE.md Retail-disc corpus; docs/native-renderer/SHADER_PACK_FORMAT.md Qualification history; docs/PERFORMANCE_BACKLOG.md PB-1.8"""

[[finding]]
group = """Other formats"""
base = """Radio_Music.fsb, Radio_VO_<lang>.fsb"""
v4 = """same"""
name = """FSB4 bank layout"""
what = """The radio banks are FSB4 version `0x40000`, header mode `0x40`: a 48-byte header (magic, sample count, header and data sizes, version, mode, 24 reserved bytes) and 80-byte sample headers (size, 30-byte name, lengths, loop points, mode, frequency, volume, pan, priority, channels, 3D and variation fields). Each music sample header is followed by a `SYNC` block of three points, each a 32-bit sample offset and a 256-byte name (`SongStart`, `EventStart`, `IdentStart`). The header block and each sample's data are zero-padded to 32 bytes. Every music sample's mode is `0x90000200`: `0x200` is FMOD's MPEG flag; the two high bits are unexplained."""
how = """`build-fh1-radio.py --check-bank` parses each bank and rebuilds its header byte for byte."""
confidence = """confirmed"""
note = """One stock sample spells its first sync point SongSTart."""
