name = """carbin part box in game"""
what = """The game places a part by its offset from the file: moving the offset moves the part, and moving it with the vertex values re-quantized to match leaves the part where it was. It does not honour a changed half-extent. Parts whose extents were refitted (made tight, or 1.5 times larger) and re-quantized rendered scaled and displaced, so the size is taken from somewhere else; copying the new boxes into the `stripped_` twins changed nothing. The boxes are not tight: the XKR-S body's spans 0 to 1.19 m in height, and its geometry starts at 0.25 m. The boxes also change how the Autoshow camera frames the car. `tools/fh1_carbin.py set_positions` therefore keeps each part's extents and refuses geometry that does not fit inside them."""
