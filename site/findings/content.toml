v4 = """sub_82CD8778, sub_8313CC98, sub_8313FEA8"""
name = """SQLite 3.6.19 and the raw query method"""
what = """The title links SQLite 3.6.19 (source id dated 2009-10-14). That version has no automatic indexes and never flattens a subquery on the right of a LEFT JOIN: it builds the subquery's rows into a temporary table and scans all of them for every outer row. Every statement is prepared with `sqlite3_prepare_v2` (`sub_8307BB98`, a stub that passes 1 as the keep-SQL flag), so a prepared statement prepares itself again after a schema change. The database object's method at +32 (`sub_82C188D0`, v4 `sub_82CD8778`) takes (recordset out, database, C string), prepares and runs the statement under the object's lock and returns a recordset. The recordset's method at +184 gives the row count and the one at +80 an integer by (row, column). The title runs `CREATE VIEW` statements on the main schema at every start, so the schema is writable at run time, and none of it is saved: each start creates the same views again. v4's virtual machine loop (`sub_8313FEA8`) is where a slow query's time goes."""
how = """Version string and source id in the executable image; the prepare stub's arguments in the generated code; queries run through the method from a host task; the SQL profile and the hitch sampler."""
confidence = """confirmed"""
source = """src/pinyon_shift_runtime_hooks.cpp RunGameSql, SpeedUpRestrictionsView; docs/UPSCALING_BACKLOG.md UP-1.7 spikes"""

