name = """Restrictions_Data_Car view"""
what = """At start v4 creates the view `Restrictions_Data_Car`: `Data_Car` LEFT JOINed with subqueries for each car's level-4 springs (`List_UpgradeSpringDamper`), level-5 tyres (`List_UpgradeTireCompound`) and level-4 transmissions (`List_UpgradeDrivetrain` joined with `List_UpgradeDrivetrainTransmission`), plus `CarValue`, `IsRally` (all three stock) and `CouldRally` (all three at those levels). `gamedb.slt` has no index on those tables, and SQLite 3.6.19 rescans all three subqueries for each of about 350 cars. When the player returns to free roam after a race, `sub_8253D9E0` (under `sub_82548B50`) reads every installed restricted car (`SELECT * FROM Restrictions_Data_Car WHERE IsCarInstalled(ModelId) ORDER BY ModelId`) on the title thread. On multivac that took 158-186 ms of one frame. Pinyon Shift indexes the four join columns and then, when the view's text is exactly v4's, replaces the view with joins on the base tables (level tests in the ON clauses, the drivetrains kept only when they have a level-4 transmission). The replacement returns the same column names and the same rows in the same order: compared on v4's database and on a copy with duplicated parts and missing level-4 transmissions. The frame then took 49-55 ms, the rest being the routine's other queries."""
