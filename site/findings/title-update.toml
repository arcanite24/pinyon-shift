[[finding]]
group = """Package and images"""
base = """default.xex, SpeechFacade_default.xex, XMediaFacade_default.xex"""
v4 = """default.xexp, SpeechFacade_default.xexp, XMediaFacade_default.xexp"""
name = """v4 applies exactly to the USA disc"""
what = """The surviving v4 update was built for media `4000D145`, version 0.0.0.12, while the supported USA disc is media `2DC7007B`, version 0.0.0.10. Applying its patches to the USA disc still produces the exact v4 images: 371/371, 54/54 and 61/61 pages match v4's own page hashes, and the image-key check passes for all three modules. The patched `default.xex` image has SHA-256 prefix `74B033805AB1BCAA` and its headers report media `2DC7007B`, version 0.0.4.10. The RSA signature over these hybrid headers is not valid; recompilation does not need it. An external report (xenia-canary issue 738, not checked here) shows the same update applying to media `2B7A1346`."""
how = """Applied each header and image delta while tracking whether every output byte came from the base, a patch literal or zero fill; checked each 64 KiB page as SHA1(page plus its own descriptor) against the previous descriptor's digest, rooted in the patch's security info. Controls: base pages verify against base headers, a flipped bit fails exactly its page, and the v4 image against base headers fails 353 of 354 pages."""
confidence = """confirmed"""
source = """docs/TITLE_UPDATE_V4_BACKLOG.md Finding: v4 applies exactly to the USA disc; docs/DLC_BACKLOG.md"""

