what = """About half of the base's functions are unchanged in v4 apart from branch displacements and absolute addresses: 27,556 of 57,127 have a unique, identical normalized body in both images, and call-graph anchoring through aligned code pairs maps 5,561 more. The rest needs instruction-window context, vtable slots and `lis`/`addi` references (for code outside `.pdata`), or a shape match that tolerates field offsets, because classes grew and their field offsets and vtable slots moved. Runs of small `subi r3,r3,4; b` thunks look identical once branches are masked, so a correct pairing must also check that direct branches reach the mapped counterparts of their targets."""
