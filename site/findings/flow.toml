# Game flow: the XML state graphs in gamemodes.zip, the States:: behaviours
# they name, and the script actions found in the executable.

# ---------------------------------------------------------------- Flow scripts

[[finding]]
group = """Flow scripts"""
id = """state-groups"""
base = """media/gamemodes.zip"""
name = """flow scripts are XML state graphs"""
what = """The game's top-level flow (start, free roam, every race type, pause, map, photo shoots, multiplayer and the rest) is data: 50 `StateGroup` XML files in `media/gamemodes.zip`, 44 distinct group ids. A group holds `State` elements; a state holds `Behaviour`, `Node`, `Entry`, `Exit` and `StateSubstitute` elements, a behaviour holds its `Attribute` (id, value) and `Transition` elements, and a node holds its own `Entry` and `Exit` elements. `Exit` and `Entry` name a `target`, and a `Node` with `state="group.state"` runs a state of another group (147 cross-group references; `global`, `Audio`, `UIShowScreens` and `InGameUI` are the most used). The free-roam flow has 908 elements; the race states file 461."""
how = """Extracted `gamemodes.zip` with `pinyon_shift_fh1_archive_extract`; counted element and attribute names and the `state` references."""
confidence = """confirmed"""

[[finding]]
group = """Flow scripts"""
id = """behaviours-are-classes"""
name = """behaviours are States:: classes"""
what = """Every `Behaviour id` in the flow scripts names a C++ class in the `States` namespace: all 439 distinct ids match an RTTI name (for example `CSetRadioPlaylist`, `CPrepareCutscene`, `CSetTimeOfDay`). The executable registers them through `CConstructor0`/`CConstructor2` templates, so a flow creates behaviours by class name. 50 `States` classes are never named by a base-game flow. New flow logic can therefore be written in XML only from existing behaviours; a new behaviour needs code."""
how = """Matched the extracted flow files against the RTTI census."""
confidence = """confirmed"""

[[finding]]
group = """Flow scripts"""
