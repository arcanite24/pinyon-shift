name = """other gamemodes.zip documents"""
what = """Besides the 50 flow files, `gamemodes.zip` holds 134 `CutsceneManager` documents (camera cuts per track, hub and festival), 99 `ActivityManager` documents (speed traps, zones, stunts, barn finds, shops, per track), five `LeaderboardManager` and two `LeaderboardEntries` documents and one `ActivityCoordinator`. Folders per world (`Colorado`, `TestBed` and the UI scenes `UIAutoshow`, `UIPaintshop`, `UIWorkshop`, `UIThumbnail`, `UIThumBig`, `UIAuctionHouse`) hold that world's copies. 254 of 292 members are XMem compressed, 38 stored."""
