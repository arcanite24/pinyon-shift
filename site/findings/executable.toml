base = """sub_823F3048, sub_823F2ED8"""
name = """volatile registers are read after calls"""
what = """The title does not treat every volatile register as dead after a call. A checking build that poisons r0, r5-r12, f0, f5-f13 and the volatile vector registers after every guest call, with a value naming the register and the call site, crashes on the simulation thread within two seconds of the race route: `sub_823F3048` calls `sub_823F2ED8` in a loop and sets r3, r4 and r5 before each call but not r6, so the callee receives whatever its previous call left in r6 and stores through it. The non-volatile registers (r1, r2, r13, r14-r31, f14-f31, v14-v31, v64-v127) were preserved by every call checked (0 mismatches in two runs). So code generation may keep non-volatile registers in locals across calls by the ABI, but may not treat a volatile register as dead at a call without knowing that the callee never reads it before writing it."""
how = """Experiment: the ABI poison checking build (PINYON_SHIFT_RECOMP_ABI_POISON, rex/ppc/abi_poison.h) on `fh1-race-sustained`; the poison value in the faulting store address decodes to r6 as left by the call at `0x823F30B0`."""
confidence = """confirmed"""
source = """docs/NEXT_LEVEL_RESEARCH.md NL-0.1"""

[[finding]]
group = """Analysis notes"""
name = """non-volatile registers read from the caller"""
what = """Some functions read a non-volatile register (r14-r31, f14-f31 or a non-volatile vector register) before writing it, so they depend on the value their caller left in it, not only on the values they save and restore. A generator that keeps those registers in per-function locals and starts them at zero crashes FH1 at boot (a null read with lr `0x823E9DE4`). In a race 13 such functions are reached through indirect calls, so no list of direct callees can cover them, and 854 functions write a non-volatile register without restoring it (vector scratch in the Direct3D code and SEH funclets). Locals are only correct if every function publishes the registers it writes at each call and return; that made the code 42-66 % larger and slower, so the registers stay in `ctx`."""
how = """Experiment: generator option `non_volatile_as_local` on `fh1-race-sustained`, with a probe build for the indirect-call targets and a scan of the generated bodies for registers read before written and written without a restore."""
confidence = """confirmed"""
source = """docs/NEXT_LEVEL_RESEARCH.md NL-1.4"""

