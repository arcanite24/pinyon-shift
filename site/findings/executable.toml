v4 = """831ADAE0, 831ADAF0, 831ADB80, 831ADBD0, 831ADCB0, 831ADD10, 831ADD20"""
name = """XAPI fiber functions"""
what = """The title's job system runs on XAPI fibers. `830EBC60` is `GetCurrentFiber` (reads the fiber pointer at KTHREAD+0x164 through KPCR+0x100). `830EBC70` is `ConvertThreadToFiber`: fails with `ERROR_ALREADY_FIBER` (1280) when that field is set, otherwise allocates a 2,640-byte fiber context, the size of the SDK's `X_FIBER_CONTEXT`. `830EBD00` is `ConvertFiberToThread`. `830EBD50` is `CreateFiber`: allocates the same context, a kernel stack through `MmCreateKernelStack` (import `0x831EE51C`) and stores the entry thunk `830EBEA0`. `830EBE30` is `DeleteFiber` (`MmDeleteKernelStack`, `0x831EE52C`). `830EBE90` is `SwitchToFiber`, a tail call to the context switch `830ED910`. The game calls them from the job scheduler `sub_8310C640` (create, switch, delete, convert) and `sub_82C0BC88`, and converts back at `0x82C7B83C`. Since October 2026 the five entry points are served by the SDK's host fibers (`[rexcrt]` in `config/rexglue/analysis/main-xex.toml`, `src/kernel/crt/threading.cpp`), so a guest fiber switch is a host fiber switch and the generated code needs no interior entries."""
