# --- Encryption and loading -----------------------------------------------

[[finding]]
group = """Encryption and loading"""
base = """sub_82C665F8, 0x82C666D0, 0x82C79D2C, 0x82C78240, 0x82C79D28"""
v4 = """0x82D272B0, 0x82D3AFF4, 0x82D390A8"""
name = """save encryption on write"""
what = """Saves go through a secure stream wrapper. `sub_82C665F8` accumulates the body and encrypts it in place with `XeKeysAesCbcUsingKey`; at `0x82C666D0` the plaintext is still visible (r4 body, r5 size). The encrypted writer `0x82C79D2C` and the stream transform `0x82C78240`, which forwards encrypted bytes to `0x82C79D28`, handle secure payloads of 19,472 bytes (the profile in older saves) and 2,928 bytes; the plaintext body grows with the profile (cars, events). Other secure files use the same path."""
how = """Save trace hooks and payload snapshots (`save.before_encrypt`)."""
confidence = """confirmed"""
source = """docs/NATIVE_PORT_BACKLOG.md Where the code stands, NP-8.3; src/pinyon_shift_runtime_hooks.cpp SnapshotSavePayload; config/rexglue/analysis/main-xex.toml save write hooks"""

