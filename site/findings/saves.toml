name = """ForzaProfile body layout"""
what = """The decrypted `ForzaProfile` body opens with a self-describing section: a big-endian field count, then per field `[u32 name length][name][u32 0x20][u32 0][u8 type][value]`. Types are 0x00 bool, 0x01 u8, 0x03 u32, 0x04 u64, 0x07 i32, 0x09 float and 0x0F struct (its own count and fields). Player values are under `Main`: `Main/Credits` (u32), `Main/XP`, `Main/Level`, `Main/WristbandLevel` and `Main/TotalWinnings`. Class-serialised states and 0xBB padding follow."""
how = """Decoding decrypted bodies at the save hooks; `tools/fh1-profile.py` decodes, edits and round-trips every captured profile byte for byte, and field edits survive the title's later saves."""
confidence = """confirmed"""
