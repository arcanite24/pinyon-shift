base = """sub_823ED888, sub_82465EB8, 0x823EDAA8, 0x829EFEB8"""
v4 = """0x8241DB68"""
name = """step and frame pairing"""
what = """After its per-frame tick, unless the transition flag at `+4168` is set, the main loop waits on the vblank step event (`sub_82465EB8` with the handle at `0x832E1260`) and then, from `0x823EDAA8`, reads its millisecond clock and runs one step. Nothing ties a step to a frame: the event comes every second vblank, and the render thread builds a frame from the newest finished step and swaps (VdSwap at `0x829EFEB8`). When the render thread takes longer than two vblanks (a guest GPU frame of 10-13 ms at the 120 fps limit and 2x), the main loop keeps stepping every 8.3 ms and the render thread skips a step every second or third frame; when the two drift in and out of phase, a frame gets no new step. Counting steps started between consecutive swaps on the race route at 2x and 120 fps: 86-91 % of frames got exactly one step, 5-8 % two (motion skipped) and 3-6 % none (a frame shown twice), with game time off the wall time between swaps by over 4 ms in 9-14 % of frames; free roam was 83 % one step and 16 % off. Holding the raise while the main loop is two steps ahead of the swaps, and raising it at the next swap, gives 98.6-99.8 % one step per frame and 1.5-2.5 % off on the base and v4 builds (99.6 % and 1.8 % in free roam)."""
how = """A per-swap counter of steps started (the delta hook at `0x823EDB84` against the VdSwap hook) and of their game time against wall time, logged every second; in-run A/B of the gate on the race-retire route (toggled every 4 s), base and v4, 2x at 120; full runs at 60 and 120 and in free roam."""
confidence = """confirmed"""
note = """The performance CSV's `simulation_tick_count` counts the per-frame tick at `0x823EDA10`, before the step wait, so it can read 0 and 2 on alternate presents while every present carries one step; judge pacing by steps per swap or by `simulation_time_ns`. Holding the main loop at `0x823EDAA8` until the swap instead (in the v4 build `0x8241DB68`) also stopped the skips but moved every step onto the swap's timing: at 60 fps the game time per frame strayed more than without the gate. The vblank callback runs inside the global critical region, so the host raise at the swap must not hold a lock the callback's gate takes: the first build looked up the event under the gate's mutex and deadlocked the vblank and render threads after about 28 minutes of play."""
issue = """#381"""
source = """src/pinyon_shift_runtime_hooks.cpp PinyonShiftGateSimulationStep, PinyonShiftNoteTitleSwap; config/rexglue/analysis/main-xex.toml midasm_hook 0x8247C6F0; docs/FEATURE_BACKLOG.md FB-0.3"""

