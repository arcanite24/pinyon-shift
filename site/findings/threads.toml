[[finding]]
group = """Frame pacing"""
base = """sub_823ED888, 0x823EDB84, owner+448"""
v4 = """0x8241DC44, owner+448"""
name = """simulation time step"""
what = """The simulation loop reads elapsed time from a millisecond clock as an integer (8 or 9 ms a tick at 120 Hz). 16 or 17 ms snaps to 1/59.94 s with a residual accumulator; the only clamp turns an elapsed time above 4000 ms into 16 ms, and the step (`f31`, in seconds) is held to at least 0.0001 s. A long frame or fence wait is therefore integrated as one large step. The step is stored at `owner+448` (`0x1C0`) at `0x823EDB84`, before the update systems run; the offset is unchanged in v4. When the title thread or the guest GPU frame sits at a two-vblank budget, the loop runs two ticks in the same millisecond and then none for 17 ms while frames still reach the display evenly, which reads as hitching (worst after a retired race); the guest clock, guest vblank pacing (steady 4.17 ms) and a display-rate mismatch were ruled out as causes. The cause is that steps and frames are paced apart: see the step and frame pairing record."""
how = """Reading the generated code; a hook reading `f31` every frame, and rewriting it before the store scales game time as expected (simulation-to-wall ratios of 0.503 at 0.5 and 2.010 at 2.0 in free roam); per-frame simulated time from the performance log at the 120 fps limit, one setting changed at a time."""
confidence = """confirmed"""
note = """FB-0.3 gives the snap as 1/60 s."""
issue = """#381"""
source = """docs/PERFORMANCE_BACKLOG.md PB-4, PB-4.2; config/mod/fh1-symbols.toml simulation.delta_store; docs/NATIVE_PORT_BACKLOG.md NP-8.1; src/pinyon_shift_runtime_hooks.cpp PinyonShiftObserveSimulationDelta; docs/FEATURE_BACKLOG.md FB-0.3"""

